<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.6/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/4.7.0/css/font-awesome.min.css}" />
    <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
    <style>
        .gsi-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 40px;
            padding: 0 12px;
            background: #fff;
            color: #1f1f1f;
            border: 1px solid #747775;
            border-radius: 4px;
            font-family: Roboto, Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }
        .gsi-button:hover {
            background: #f1f1f1;
            color: #1f1f1f;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<main class="flex-fill d-flex justify-content-center align-items-center text-center p-4">
  <div>
    <h1 class="mb-3">PROTOGE ©</h1>
    <p class="mb-4">Tool for natural language-based argumentation schema</p>
    <div class="d-flex justify-content-center gap-4 align-items-stretch">
      <a th:href="@{/oauth2/authorization/google}" class="gsi-button">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Sign in with Google</span>
      </a>
      <a href="#" class="btn btn-primary h-100 d-none">Introductory video</a>

</main>

<footer class="mt-auto py-3 border-top">
